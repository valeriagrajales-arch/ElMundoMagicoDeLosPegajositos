<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>El Mundo Mágico de los Pegajositos Ecológicos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Diseño: un mundo de aventura en una sola columna (máx. 600px). Cielo y colinas de fondo, mapa SVG con caminos, nodos-lugar y compañeros Pegajositos.
   Look comprometido con una sola paleta luminosa (sin modo oscuro, a propósito: es un mundo de día). */
:root{
  --sky:#7fdcff; --sky2:#d8f6ff; --teal:#12b5b0; --leaf:#2fa84f; --leaf2:#7ed957;
  --sun:#ffd23f; --sun2:#ffb300; --coral:#ff6b6b; --berry:#8f4fe0; --ink:#17375e; --ink2:#46648a;
  --card:#fffdf4; --line:#cfe9f2; --ok:#22a055; --hint:#e08a00;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-weight:700;font-size:17px;color:var(--ink);
  background:linear-gradient(#86ddff,#d8f6ff 55%,#c9f2b5) fixed;background-color:#bfefff;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow-x:hidden}
#app{max-width:600px;margin:0 auto;min-height:100%;position:relative}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
img.pj{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 6px 4px rgba(23,55,94,.22))}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid #ff7a00;outline-offset:3px;border-radius:14px}

/* pantallas */
.screen{padding:10px max(16px,env(safe-area-inset-left,0px)) 118px max(16px,env(safe-area-inset-right,0px));animation:in .4s ease both;position:relative}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* botones */
.btn{font:800 1.3rem/1 var(--f-display);border:0;border-radius:999px;padding:16px 28px;min-height:58px;cursor:pointer;
  background:linear-gradient(#ffe066,var(--sun2));color:#5a3200;box-shadow:0 6px 0 #d98200,0 12px 18px rgba(0,0,0,.12);
  transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d98200}
.btn.green{background:linear-gradient(#7ee08a,#2fa84f);color:#fff;box-shadow:0 6px 0 #1d7a38,0 12px 18px rgba(0,0,0,.12);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.green:active{box-shadow:0 1px 0 #1d7a38}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 6px 0 #b9d6e2,0 12px 18px rgba(0,0,0,.1)}
.btn.white:active{box-shadow:0 1px 0 #b9d6e2}
.btn.red{background:linear-gradient(#ff9a8a,#ee5252);color:#fff;box-shadow:0 6px 0 #b83030}
.btn.small{font-size:1.02rem;padding:10px 18px;min-height:46px}
.btn.big{font-size:1.75rem;padding:20px 34px;min-height:76px;animation:throb 2.2s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.05)}}
.btn.big:active{animation:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* cabecera */
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 10px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:7px 14px;font:800 1.05rem var(--f-display);box-shadow:0 4px 0 #b9d6e2;display:inline-flex;gap:7px;align-items:center}
.pill b{color:#e29a00}
.bar{height:16px;border-radius:99px;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.15);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7ee08a,#ffd23f);transition:width .6s}
.title{font-size:clamp(1.9rem,8vw,2.6rem);color:var(--ink);text-shadow:0 3px 0 #fff}

/* inicio */
.home{min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-bottom:40px;overflow:hidden}
.home .bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.logo-slot{align-self:flex-start;background:rgba(255,255,255,.85);border:3px dashed #7aa7bd;border-radius:20px;padding:8px 14px;font:700 .85rem var(--f-body);color:var(--ink2);display:flex;gap:8px;align-items:center;min-height:52px}
.logo-slot img{height:52px;width:auto}
.logo-ico{width:30px;height:30px;border-radius:50%;background:#e4f6fb;display:grid;place-items:center;font-size:1rem}
.home h1{font-size:clamp(2.1rem,9.4vw,3.3rem);color:#fff;text-shadow:0 4px 0 #0f7fa3,0 8px 14px rgba(0,60,90,.35);-webkit-text-stroke:1px rgba(8,90,120,.25)}
.home h1 em{display:block;font-style:normal;color:#ffe45c;text-shadow:0 4px 0 #b27800,0 8px 14px rgba(0,60,90,.35)}
.hello{background:rgba(255,255,255,.92);border-radius:24px;padding:12px 18px;font-size:1.15rem;max-width:420px;box-shadow:0 5px 0 #b9d6e2;margin:0}
.crowd{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px;width:100%;max-width:480px;align-items:end}
.crowd .pj{width:100%;animation:bob 3.2s ease-in-out infinite}
.crowd div:nth-child(2n) .pj{animation-delay:-.8s}.crowd div:nth-child(3n) .pj{animation-delay:-1.6s}.crowd div:nth-child(5n) .pj{animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-9px) rotate(1.5deg)}}

/* mapa */
.map-wrap{position:relative;border-radius:30px;overflow:hidden;box-shadow:0 8px 0 rgba(23,55,94,.2),0 18px 30px rgba(0,60,90,.2);border:5px solid #fff;background:#bff0ff}
.map-wrap svg{display:block;width:100%;height:auto}
.node{cursor:pointer;outline:none}
.node:focus-visible .nring{stroke:#ff7a00;stroke-width:5}
.node:active .nbody{transform:translateY(3px)}
.nbody{transition:transform .12s}
.node.locked .nbody{filter:grayscale(.85) brightness(1.05);opacity:.8}
.nring{fill:none;stroke:transparent}
.node.avail .halo{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18);opacity:.35}}
.cloud{animation:drift 26s ease-in-out infinite alternate}.cloud.c2{animation-duration:34s;animation-delay:-8s}
@keyframes drift{to{transform:translateX(40px)}}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.hint-line{text-align:center;margin:12px 0 0;color:var(--ink);font-size:1.05rem}

/* lugar */
.back{margin-bottom:10px}
.place-head{border-radius:30px;padding:18px 16px 16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 0 rgba(23,55,94,.2)}
.place-head h2{font-size:clamp(1.8rem,7.5vw,2.4rem);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.say{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.say .pj{width:clamp(96px,28vw,140px);flex:none;animation:bob 3.2s ease-in-out infinite}
.bubble{position:relative;background:#fff;color:var(--ink);border-radius:24px;padding:14px 16px;font-size:1.08rem;line-height:1.3;box-shadow:0 5px 0 rgba(23,55,94,.15);flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble.ok{background:#e6ffec;box-shadow:0 5px 0 #8fd9a3}.bubble.ok::before{border-right-color:#e6ffec}
.bubble.hint{background:#fff4d6;box-shadow:0 5px 0 #f1cd77}.bubble.hint::before{border-right-color:#fff4d6}
.acts{display:grid;gap:12px;margin-top:18px}
.act{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:26px;padding:14px 16px;min-height:84px;cursor:pointer;text-align:left;box-shadow:0 6px 0 #b9d6e2;width:100%;transition:transform .1s}
.act:active{transform:translateY(5px);box-shadow:0 1px 0 #b9d6e2}
.act .ic{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:1.9rem;flex:none;background:#e8f7ff}
.act h3{font-size:1.3rem}.act small{display:block;color:var(--ink2);font-weight:700;font-size:.95rem;margin-top:3px}
.stars{display:inline-flex;gap:2px;font-size:1.25rem;line-height:1}
.stars .on{color:#ffb800;text-shadow:0 2px 0 #c98a00}.stars .off{color:#d4dfe6}
.act .stars{margin-left:auto}
.medal-row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:24px;padding:12px 16px;margin-top:16px;box-shadow:0 5px 0 #b9d6e2}

/* jugador */
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dots{display:flex;gap:7px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
.dots i.d{background:var(--leaf2)}.dots i.c{background:var(--sun);transform:scale(1.25)}
.coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.coach .pj{width:clamp(84px,24vw,118px);flex:none}
.coachimg.happy .pj{animation:jump .7s ease both}
.coachimg.wiggle .pj{animation:wig .6s ease both}
.coachimg.idle .pj{animation:bob 3.2s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px) scale(1.06)}60%{transform:translateY(0) scale(.97,1.03)}80%{transform:translateY(-10px)}}
@keyframes wig{20%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.stage{background:var(--card);border-radius:30px;padding:18px 16px;box-shadow:0 7px 0 #b9d6e2}
.scene{display:grid;place-items:center;font-size:4.6rem;line-height:1;background:linear-gradient(#e8f9ff,#d4f3c6);border-radius:24px;padding:18px;margin-bottom:14px;min-height:130px}
.q{font-size:clamp(1.4rem,5.6vw,1.8rem);text-align:center;margin-bottom:14px;color:var(--ink)}
.opts{display:grid;gap:11px}
.opt{border:0;border-radius:22px;background:#fff;padding:15px 16px;font:800 1.15rem/1.2 var(--f-body);text-align:left;cursor:pointer;min-height:60px;display:flex;gap:12px;align-items:center;
  box-shadow:0 5px 0 #b9d6e2,inset 0 0 0 3px #e3f1f7;transition:transform .1s;width:100%}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #b9d6e2}
.opt.right{background:#dcffe5;box-shadow:0 5px 0 #6fcf8b,inset 0 0 0 4px #2fa84f}
.opt.nope{background:#fff2dc;color:#8b6a2a;box-shadow:0 5px 0 #efd08d,inset 0 0 0 3px #f6d58f}
.opt[disabled]{cursor:default}
.opt .ico{font-size:1.7rem}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font:800 1.4rem var(--f-display);min-height:78px;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{border:0;border-radius:24px;background:#fff;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:132px;
  box-shadow:0 5px 0 #b9d6e2,inset 0 0 0 3px #e3f1f7;font:800 1rem/1.15 var(--f-body)}
.tile:active{transform:translateY(4px)}
.tile .big{font-size:2.8rem;line-height:1}
.tile.right{background:#dcffe5;box-shadow:0 5px 0 #6fcf8b,inset 0 0 0 4px #2fa84f}
.tile.nope{background:#fff2dc;box-shadow:0 5px 0 #efd08d,inset 0 0 0 3px #f6d58f}
.tile[disabled]{cursor:default}
.pfoot{display:flex;justify-content:center;margin-top:16px;min-height:62px}

/* clasificar */
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.bin{border:0;border-radius:22px 22px 14px 14px;padding:10px 6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px;
  font:800 clamp(.8rem,3.5vw,1rem)/1.1 var(--f-display);overflow-wrap:anywhere;box-shadow:0 6px 0 rgba(23,55,94,.25);text-align:center;transition:transform .12s}
.bin small{font:700 .8rem/1.1 var(--f-body);opacity:.9}
.bin .lid{width:78%;height:12px;border-radius:8px;background:rgba(0,0,0,.18);margin-bottom:2px}
.bin .cnt{font-size:1.5rem;min-height:1.7rem;word-break:break-all;line-height:1.1}
.bin.over,.bin.target{transform:scale(1.07);outline:5px solid #ffb300}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:90px;padding:6px 0}
.chip{touch-action:none;user-select:none;border:0;background:#fff;border-radius:20px;padding:8px 10px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:92px;max-width:130px;font:800 .88rem/1.1 var(--f-body);box-shadow:0 5px 0 #b9d6e2,inset 0 0 0 3px #e3f1f7}
.chip .em{font-size:2.3rem;line-height:1.1}
.chip.sel{background:#fff4c2;box-shadow:0 5px 0 #efc542,inset 0 0 0 4px #ffb300;transform:translateY(-4px) scale(1.05)}
.chip.lifted{opacity:.25}
.chip.shake{animation:wig .5s}
.ghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-60%) scale(1.12) rotate(-4deg);box-shadow:0 14px 20px rgba(0,0,0,.25)}
.tip{text-align:center;color:var(--ink2);font-size:.98rem;margin:0 0 8px}

/* resultado, personajes, logros */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.result .pj{width:clamp(140px,44vw,210px);animation:jump 1.1s ease .1s both,bob 3.2s ease-in-out 1.2s infinite}
.big-stars{font-size:3.4rem;display:flex;gap:6px}
.big-stars span{display:inline-block;animation:pop .55s cubic-bezier(.3,1.7,.5,1) both}
.big-stars span:nth-child(2){animation-delay:.2s}.big-stars span:nth-child(3){animation-delay:.4s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.medal{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:3.6rem;background:radial-gradient(#fff2a8,#ffc928);border:6px solid #fff;box-shadow:0 8px 0 #d99a00,0 0 0 8px rgba(255,210,63,.4);animation:pop .8s .5s cubic-bezier(.3,1.7,.5,1) both}
.medal.off{background:#e6eef2;box-shadow:0 5px 0 #c3d3db;filter:grayscale(1);opacity:.7;animation:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pcard{border:0;border-radius:28px;background:var(--card);padding:14px 10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 #b9d6e2;text-align:center;position:relative}
.pcard:active{transform:translateY(5px);box-shadow:0 1px 0 #b9d6e2}
.pcard .pj{width:78%;max-height:150px;object-fit:contain}
.pcard h3{font-size:1.2rem}
.tag{display:inline-block;border-radius:99px;padding:3px 12px;font:800 .9rem var(--f-display);color:#fff;background:var(--teal)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,50,80,.55);z-index:60;display:grid;place-items:end center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(600px,100%);background:var(--card);border-radius:34px 34px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:up .35s cubic-bezier(.2,1.2,.4,1) both;max-height:92svh;overflow:auto}
.sheet.mid{border-radius:34px;margin:auto 16px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet .pj{width:min(190px,48vw)}
.sheet h2{font-size:1.9rem}
.sheet p{margin:0;font-size:1.1rem;line-height:1.35}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.badge{background:var(--card);border-radius:24px;padding:12px 10px;text-align:center;box-shadow:0 5px 0 #b9d6e2;display:flex;flex-direction:column;align-items:center;gap:4px}
.badge .bi{font-size:2.3rem;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#fff6c0,#ffd23f);box-shadow:0 4px 0 #d99a00}
.badge.off .bi{background:#e6eef2;box-shadow:0 4px 0 #c3d3db;filter:grayscale(1);opacity:.6}
.badge b{font:800 1.05rem var(--f-display)}.badge small{font-size:.85rem;color:var(--ink2);font-weight:700}
.sec{font-size:1.5rem;margin:22px 0 4px;text-shadow:0 2px 0 #fff}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border-radius:22px;padding:12px 18px;box-shadow:0 6px 0 #b9d6e2,0 14px 24px rgba(0,0,0,.2);z-index:70;max-width:min(92vw,420px);text-align:center;animation:up .3s both}

/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.nav nav{pointer-events:auto;width:100%;max-width:560px;background:#fff;border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;gap:4px;box-shadow:0 6px 0 #b9d6e2,0 14px 28px rgba(0,60,90,.25)}
.nav button{border:0;background:transparent;border-radius:24px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 .8rem/1.1 var(--f-display);cursor:pointer;min-height:58px;color:var(--ink2)}
.nav button .ni{font-size:1.5rem;line-height:1.1}
.nav button.on{background:linear-gradient(#ffe066,var(--sun2));color:#5a3200;box-shadow:0 3px 0 #d98200}
.nav button:active{transform:translateY(2px)}

/* confeti */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
#fx i{position:absolute;top:-20px;width:11px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hide{display:none!important}

@media(min-width:700px){.screen{padding-top:22px}.hello{font-size:1.3rem}.crowd{gap:8px 14px}}
@media(max-width:360px){.btn.big{font-size:1.45rem;padding:16px 20px}.chip{min-width:84px}.bin{min-height:120px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>

<div id="app"></div>
<div id="fx" aria-hidden="true"></div>
<div id="overlay"></div>

<script>
/* ============================================================
   DATOS EDITABLES (personajes, escenarios, actividades, premios)
   Cambia aquí nombres, valores y textos sin tocar el resto.
   ============================================================ */
const CONFIG = {
  titulo: 'El Mundo Mágico de los Pegajositos Ecológicos',
  logoColegio: '',          // Pega aquí la URL o data:URI del logo del colegio. Vacío = muestra un espacio reservado.
  storageKey: 'pegajositos-ecologicos-v1'
};

/* PERSONAJES: imagen = img/p{id}.webp. NOMBRES Y VALORES PROVISIONALES: reemplázalos por los oficiales. */
const CHARS = [
  {id:1, name:'Pegajosito Corazón', value:'Amistad',       color:'#ee4b4b', phrase:'¡Un amigo hace todo más bonito! Yo reparto abrazos y buenas ideas.'},
  {id:2, name:'Pegajosito Rosita',  value:'Respeto',       color:'#d9407e', phrase:'Con respeto y palabras amables, todos nos sentimos bien.'},
  {id:3, name:'Pegajosito Verde',   value:'Cuidado del planeta', color:'#2fa84f', phrase:'¡Me encanta reciclar! Cada cosa en su lugar cuida nuestro valle.'},
  {id:4, name:'Pegajosito Azul',    value:'Cuidado del agua', color:'#2a7fe0', phrase:'Cada gota cuenta. ¡Cuidemos el agua del río!'},

   ============================================================ */
const KEY = CONFIG.storageKey;
function loadState(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||'{}'); return {done:o.done||{}, medals:o.medals||{}, seen:o.seen||{}}; }catch(e){ return {done:{},medals:{},seen:{}}; } }
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = loadState();
const starCount = () => Object.values(S.done).reduce((a,b)=>a+b,0);
const doneCount = () => Object.keys(S.done).length;
const medalCount = () => Object.keys(S.medals).length;
const points = () => starCount()*10 + medalCount()*20;
const totalActs = () => PLACES.reduce((a,p)=>a+p.acts.length,0);
const placeById = id => PLACES.find(p=>p.id===id);
const charById = id => CHARS.find(c=>c.id===id);
const isLocked = p => !!p.needMedals && medalCount() < p.needMedals;
const placeDone = p => p.acts.every(a=>S.done[a.id]);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

}
function flower(x,y,c){ return `<g transform="translate(${x} ${y})"><rect x="-1" y="0" width="2" height="9" fill="#2f9e4a"/><circle r="4" cx="0" cy="-1" fill="${c}"/><circle r="1.8" cx="0" cy="-1" fill="#fff6a0"/></g>`; }
function sparkle(x,y,d){ return `<path class="tw" style="animation-delay:${d}s" d="M${x} ${y-7} L${x+2} ${y-2} L${x+7} ${y} L${x+2} ${y+2} L${x} ${y+7} L${x-2} ${y+2} L${x-7} ${y} L${x-2} ${y-2}Z" fill="#fff9b0"/>`; }

function dotsHTML(){
  const r=V.run; const n=r.total;

function stageHTML(){
  const r=V.run, a=r.act;
  if(a.type==='quiz' || a.type==='tf'){
    const q=a.qs[r.step];
    const body = a.type==='quiz'
      ? `<div class="opts">${q.opts.map((o,i)=>`<button class="opt ${r.ok&&i===q.a?'right':r.wrong.includes(i)?'nope':''}" data-act="pick" data-i="${i}" ${r.ok||r.wrong.includes(i)?'disabled':''}>${esc(o)}</button>`).join('')}</div>`
      : `<div class="tf">${[true,false].map((v,i)=>`<button class="opt ${r.ok&&v===q.a?'right':r.wrong.includes(i)?'nope':''}" data-act="pick" data-i="${i}" ${r.ok||r.wrong.includes(i)?'disabled':''}>${v?'✓ Verdadero':'✗ Falso'}</button>`).join('')}</div>`;
    return `<div class="stage"><div class="scene" aria-hidden="true">${q.icon}</div><h2 class="q">${esc(q.q)}</h2>${body}</div>`;
  }
  if(a.type==='situation'){
    const q=a.qs[r.step];
    return `<div class="stage"><div class="scene" aria-hidden="true">${q.icon}</div><h2 class="q">${esc(q.text)}</h2><p class="tip">¿Qué harías?</p>
      <div class="opts">${q.ch.map((c,i)=>`<button class="opt ${r.ok&&c.good?'right':r.wrong.includes(i)?'nope':''}" data-act="pick" data-i="${i}" ${r.ok||r.wrong.includes(i)?'disabled':''}>${esc(c.t)}</button>`).join('')}</div></div>`;
  }
  if(a.type==='find'){
    return `<div class="stage"><h2 class="q">${esc(a.prompt)}</h2><p class="tip">Encontradas: <b>${r.found.length}</b> de ${a.need}</p>
      <div class="tiles">${a.tiles.map((t,i)=>`<button class="tile ${r.found.includes(i)?'right':r.wrong.includes(i)?'nope':''}" data-act="tile" data-i="${i}" ${r.found.includes(i)||r.ok?'disabled':''}><span class="big" aria-hidden="true">${t.icon}</span>${esc(t.label)}</button>`).join('')}</div></div>`;
  }
  if(a.type==='sort'){
    const sel=r.sel;
    return `<div class="stage"><p class="tip">${sel?'¡Ahora toca la caneca correcta!':'Toca un objeto o arrástralo a su caneca.'}</p>
      <div class="bins">${a.bins.map(b=>`<button class="bin ${sel?'target':''}" data-act="bin" data-bin="${b.id}" style="background:${b.color};color:${b.fg}" aria-label="Caneca ${esc(b.label)}: ${esc(b.sub)}">
        <span class="lid"></span><span class="cnt" aria-hidden="true">${(r.placed[b.id]||[]).map(i=>i.icon).join('')}</span><span>${esc(b.label)}</span><small>${esc(b.sub)}</small></button>`).join('')}</div>
      <div class="chips">${r.left.map(i=>`<button class="chip ${sel===i.id?'sel':''}" data-act="chip" data-item="${i.id}"><span class="em" aria-hidden="true">${i.icon}</span>${esc(i.label)}</button>`).join('')}</div></div>`;
  }
  return '';
}

function confetti(n=44){
  if(reduceMotion()) return;
  const cols=['#ffd23f','#ff6b6b','#5fd0ff','#7ed957','#c084fc','#ff9ec0'];
  for(let i=0;i<n;i++){
    const e=document.createElement('i'); e.style.left=Math.random()*100+'vw'; e.style.background=rnd(cols);
    e.style.animationDuration=(1.8+Math.random()*1.8)+'s'; e.style.animationDelay=(Math.random()*.5)+'s'; e.style.transform=`rotate(${Math.random()*360}deg)`;
    $fx.appendChild(e); setTimeout(()=>e.remove(),4200);
  }
}

/* ============================================================
   LÓGICA DE ACTIVIDADES
   ============================================================ */
function startAct(actId){
  let place=null, act=null;
  PLACES.forEach(p=>p.acts.forEach(a=>{ if(a.id===actId){place=p;act=a;} }));
  if(!act) return;
  if(isLocked(place)){ toast(`Consigue ${place.needMedals} medallas para abrir este lugar.`); return; }
  const total = act.type==='sort' ? act.items.length : act.type==='find' ? act.need : act.qs.length;
  V.place=place; V.res=null;
  V.run={act, place, char:place.char, step:0, progress:0, total, mistakes:0, ok:false, ready:false, wrong:[], found:[], msg:null, react:'idle',
         left: act.type==='sort' ? act.items.map(i=>i).sort(()=>Math.random()-.5) : [], placed:{}, sel:null};
  V.screen='play'; render();
}
function helperChar(r){ return r.place.helpers.includes(r.char) ? r.char : r.place.char; }
function say(tone, text, react){ const r=V.run; r.msg={tone,text}; r.react=react; }
function good(extra){ const r=V.run; say('ok', rnd(MSG_OK)+(extra?' '+extra:''),'happy'); }
function oops(extra){ const r=V.run; r.mistakes++; say('hint', rnd(MSG_RETRY)+(extra?' '+extra:''),'wiggle'); }

function pick(i){
  const r=V.run, a=r.act; if(r.ok) return;
  if(a.type==='quiz'){ const q=a.qs[r.step]; if(i===q.a){ r.ok=true; r.ready=true; r.progress=r.step+1; good(q.why); } else { r.wrong.push(i); oops(q.hint); } }
  else if(a.type==='tf'){ const q=a.qs[r.step]; const val = i===0; if(val===q.a){ r.ok=true; r.ready=true; r.progress=r.step+1; good(q.why); } else { r.wrong.push(i); oops(q.why); } }
  else if(a.type==='situation'){ const q=a.qs[r.step], c=q.ch[i];
    if(c.good){ r.ok=true; r.ready=true; r.progress=r.step+1; say('ok', rnd(MSG_OK)+' '+c.res,'happy'); }
    else { r.wrong.push(i); r.mistakes++; say('hint', c.res,'wiggle'); } }
  render(); if(r.ok&&r.react==='happy') confetti(18);
}
function tile(i){
  const r=V.run, a=r.act, t=a.tiles[i]; if(r.ok||r.found.includes(i)) return;
  if(t.waste){ r.found.push(i); r.progress=r.found.length; good(t.why);
    if(r.found.length>=a.need){ r.ok=true; r.ready=true; say('ok','¡Los encontraste todos! '+rnd(MSG_OK),'happy'); confetti(18);} }
  else { r.wrong.includes(i)||r.wrong.push(i); r.mistakes++; say('hint','¡Esa acción ayuda al agua! Busca las que la gastan de más.','wiggle'); }
  render();
}
function attempt(itemId, binId){
  const r=V.run, a=r.act, it=r.left.find(x=>x.id===itemId); if(!it) return;
  if(it.bin===binId){
    r.left=r.left.filter(x=>x.id!==itemId); (r.placed[binId]=r.placed[binId]||[]).push(it); r.sel=null; r.progress++;
    good(it.hint);
    if(!r.left.length){ r.ready=true; say('ok','¡Terminaste de separar todo! '+rnd(MSG_OK),'happy'); confetti(26); }
  } else { r.mistakes++; r.sel=null; say('hint', rnd(MSG_RETRY)+' '+it.hint,'wiggle'); }
  render();
}
function nextStep(){
  const r=V.run, a=r.act;
  if(a.type==='sort' || a.type==='find' || r.step>=a.qs.length-1){ finish(); return; }
  r.step++; r.ok=false; r.ready=false; r.wrong=[]; r.msg=null; r.react='idle'; r.char = rnd(r.place.helpers);
  render();
}
function finish(){
  const r=V.run, p=r.place, a=r.act;
  const stars = r.mistakes===0?3 : r.mistakes<=2?2 : 1;   // premia aprender y persistir, no la rapidez
  S.done[a.id] = Math.max(S.done[a.id]||0, stars);
  let newMedal=false;
  if(placeDone(p) && !S.medals[p.id]){ S.medals[p.id]=true; newMedal=true; }
  saveState();
  V.res={stars,newMedal,place:p,act:a}; V.run=null; V.screen='result'; render();
  confetti(newMedal?90:50);
}

/* ---------- arrastrar y soltar (con alternativa por toques) ---------- */
let drag=null, lastDrop=0;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest&&e.target.closest('.chip'); if(!c||!V.run||V.run.act.type!=='sort') return;
  drag={id:c.dataset.item,x:e.clientX,y:e.clientY,el:c,moved:false,ghost:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){
    drag.moved=true; const g=drag.el.cloneNode(true); g.classList.add('ghost'); g.style.width=drag.el.offsetWidth+'px'; document.body.appendChild(g); drag.ghost=g; drag.el.classList.add('lifted');
  }
  if(drag.moved){
    drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
    document.querySelectorAll('.bin').forEach(b=>b.classList.remove('over'));
    const b=document.elementFromPoint(e.clientX,e.clientY); const bin=b&&b.closest&&b.closest('.bin'); if(bin) bin.classList.add('over');
  }
});
function endDrag(e,cancel){
  if(!drag) return; const d=drag; drag=null;
  if(d.ghost) d.ghost.remove(); d.el.classList.remove('lifted'); document.querySelectorAll('.bin').forEach(b=>b.classList.remove('over'));
  if(d.moved){
    lastDrop=Date.now();
    if(!cancel){ const t=document.elementFromPoint(e.clientX,e.clientY); const bin=t&&t.closest&&t.closest('.bin'); if(bin&&V.run) attempt(d.id,bin.dataset.bin); }
  }
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* ============================================================
   EVENTOS
   ============================================================ */
function go(to){
  V.run=null; V.res=null; V.sheet=null; V.confirm=false; V.screen=to; if(to!=='place') V.place=to==='map'?null:V.place; render();
}
function onAct(el,e){
  const act=el.dataset.act, d=el.dataset;
  switch(act){
    case 'go': go(d.to); break;
    case 'place': { const p=placeById(d.id); if(isLocked(p)){ toast(`Consigue ${p.needMedals} medallas para abrir la ${p.name}.`); break; } V.place=p; V.screen='place'; render(); break; }
    case 'start': startAct(d.id); break;
    case 'exit': V.run=null; V.screen='place'; render(); break;
    case 'pick': pick(+d.i); break;
    case 'tile': tile(+d.i); break;
    case 'chip': { if(Date.now()-lastDrop<400) break; const r=V.run; r.sel = r.sel===d.item?null:d.item; render(); break; }
    case 'bin': { if(Date.now()-lastDrop<400) break; const r=V.run; if(!r.sel){ say('hint','Primero toca un objeto y luego su caneca.','wiggle'); render(); } else attempt(r.sel,d.bin); break; }
    case 'next': nextStep(); break;
    case 'char': { V.sheet=+d.id; S.seen[d.id]=true; saveState(); render(); break; }
    case 'closesheet': if(e.target.closest('[data-stop]') && !e.target.closest('.btn')) break; V.sheet=null; render(); break;
    case 'askreset': V.confirm=true; render(); break;
    case 'cancelreset': V.confirm=false; render(); break;
    case 'doreset': S={done:{},medals:{},seen:{}}; saveState(); V.confirm=false; render(); toast('¡Listo! Puedes empezar una nueva aventura.'); break;
  }
}
const $app=document.getElementById('app'), $ov=document.getElementById('overlay'), $fx=document.getElementById('fx');
document.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('[data-act]'); if(el) onAct(el,e); });
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('g[data-act]')){ e.preventDefault(); onAct(e.target,e); }
  if(e.key==='Escape'&&(V.sheet||V.confirm)){ V.sheet=null; V.confirm=false; render(); }
});
render();
</script>
